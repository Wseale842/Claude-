    <text x="518" y="106" fill="#6E6A86">+ lecteur Navori StiX 3800 PoE par écran</text>
    <rect x="504" y="120" width="372" height="60" rx="8" fill="#fff" stroke="#E4E1F0"/>
    <text x="518" y="142" font-size="12.5" font-weight="bold">Groupe Entrées — 2 totems</text>
    <text x="518" y="160">Samsung OHDX 55" sur totem ERARD OUTDOOH</text>
    <text x="518" y="174" fill="#6E6A86">+ lecteur Navori StiX 3800 PoE par écran</text>
    <rect x="504" y="188" width="372" height="60" rx="8" fill="#fff" stroke="#E4E1F0"/>
    <text x="518" y="210" font-size="12.5" font-weight="bold">Groupe Livraisons — 1 totem</text>
    <text x="518" y="228">Samsung OHDX 55" sur totem ERARD OUTDOOH</text>
    <text x="518" y="242" fill="#6E6A86">+ lecteur Navori StiX 3800 PoE</text>
    <rect x="504" y="256" width="372" height="72" rx="8" fill="#fff" stroke="#E4E1F0"/>
    <text x="518" y="278" font-size="12.5" font-weight="bold">Groupe Salles de réunion — 10 écrans</text>
    <text x="518" y="296">iiyama 86" 4K sur chariot Chief — hors réunion :</text>
    <text x="518" y="310">messages HSE, planning, alertes</text>
    <text x="518" y="324" fill="#6E6A86">+ lecteur Navori StiX 3800 PoE par écran</text>
  </g>
  <g stroke="#2B2640" stroke-width="1.4" fill="none">
    <path d="M474 150 H488 V82 H502" marker-end="url(#a)"/>
    <path d="M474 160 H488 V150 H502" marker-end="url(#a)"/>
    <path d="M474 210 H488 V218 H502" marker-end="url(#a)"/>
    <path d="M474 230 H488 V292 H502" marker-end="url(#a)"/>
  </g>
  <text x="450" y="372" text-anchor="middle" font-size="11" fill="#6E6A86">Lecteurs avec contenus en mémoire locale : l'affichage continue en cas de coupure réseau · aucun accès internet · aucun abonnement cloud</text>
</svg>
