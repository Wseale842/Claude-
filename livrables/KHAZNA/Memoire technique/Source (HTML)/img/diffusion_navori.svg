  <path d="M164 270 H182 V212 H194" fill="none" stroke="#E5484D" stroke-width="1.6" marker-end="url(#r)"/>
  <!-- serveur -->
  <rect x="252" y="135" width="170" height="110" rx="10" fill="url(#g)"/>
  <text x="337" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Serveur Navori QL</text>
  <text x="337" y="180" text-anchor="middle" font-size="11" fill="#fff">installé sur site — baie Hub 1</text>
  <text x="337" y="196" text-anchor="middle" font-size="11" fill="#fff">secouru par l'onduleur</text>
  <text x="337" y="212" text-anchor="middle" font-size="11" fill="#fff">programmation · groupes</text>
  <text x="337" y="228" text-anchor="middle" font-size="11" fill="#fff">supervision des lecteurs</text>
  <path d="M224 190 H250" stroke="#2B2640" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- anneau -->
  <rect x="448" y="92" width="26" height="196" rx="4" fill="#fff" stroke="#7598F4" stroke-width="1.5"/>
  <text x="461" y="190" text-anchor="middle" font-size="10.5" fill="#2B2640" transform="rotate(-90 461 190)">anneau fibre + switchs de zone PoE</text>
  <path d="M422 190 H446" stroke="#2B2640" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- groupes -->
  <g font-size="11" fill="#2B2640">
    <rect x="504" y="52" width="372" height="60" rx="8" fill="#fff" stroke="#E4E1F0"/>
