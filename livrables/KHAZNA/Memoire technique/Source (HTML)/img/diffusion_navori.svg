<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Arial,Helvetica,sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8860FE"/><stop offset=".5" stop-color="#7598F4"/><stop offset="1" stop-color="#66C2EB"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B2640"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E5484D"/></marker>
  </defs>
  <rect width="900" height="400" fill="#fff"/>
  <!-- zones -->
  <rect x="12" y="40" width="168" height="300" rx="10" fill="#F7F6FC" stroke="#E4E1F0"/>
  <text x="96" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#6E6A86">RÉSEAU EXYTE</text>
  <rect x="236" y="40" width="652" height="300" rx="10" fill="#F7F6FC" stroke="#E4E1F0"/>
  <text x="562" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#6E6A86">RÉSEAU TERRAIN PROSYB — VLAN 50 « AFFICHAGE »</text>
  <!-- postes EXYTE -->
  <rect x="28" y="70" width="136" height="70" rx="8" fill="#fff" stroke="#7598F4" stroke-width="1.5"/>
  <text x="96" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B2640">Postes EXYTE</text>
  <text x="96" y="114" text-anchor="middle" font-size="11" fill="#6E6A86">HSE · communication</text>
  <text x="96" y="129" text-anchor="middle" font-size="11" fill="#6E6A86">navigateur web</text>
  <rect x="28" y="230" width="136" height="80" rx="8" fill="#FDECEC" stroke="#E5484D" stroke-width="1.5"/>
  <text x="96" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#B4232A">Alerte prioritaire</text>
  <text x="96" y="274" text-anchor="middle" font-size="11" fill="#2B2640">évacuation · vent fort</text>
  <text x="96" y="289" text-anchor="middle" font-size="11" fill="#2B2640">accès fermé — 1 clic,</text>
  <text x="96" y="303" text-anchor="middle" font-size="11" fill="#2B2640">tous les écrans</text>
  <!-- pare-feu -->
  <rect x="196" y="150" width="28" height="80" rx="4" fill="#2B2640"/>
  <text x="210" y="190" text-anchor="middle" font-size="11" fill="#fff" transform="rotate(-90 210 190)">PARE-FEU</text>
